# Ships the checks CLI archive through GitHub Releases; no npm registry publication.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The tag matches package.json and plugin.json
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')" = "$version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: The committed bundle and manifest match the source
        run: git diff --exit-code -- plugin/dist plugin/.claude-plugin
      - run: pnpm test
      - name: The CLI archive gets its standalone README
        run: cp scripts/npm/README.md README.md
      - name: Pack the dependency-free CLI archive
        run: npm pack --ignore-scripts
      - name: Attach the CLI archive to the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" fwos-check-*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
