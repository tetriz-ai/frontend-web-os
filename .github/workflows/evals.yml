# Plugin evals call a model, so they need a credential: run by hand only, never on pull requests.
# They compare the plugin against a no-plugin baseline and stop at the cost cap.
name: Evals
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Case name glob
        default: "*"
permissions:
  contents: read
jobs:
  evals:
    name: Plugin evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code@2.1.278
      - run: claude plugin eval plugin --case "${{ inputs.cases }}" --trust-plugin --no-publish --max-cost-usd 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
